name: Publicar

# Cada push na main monta o app e confere que ele compila. Quem publica em
# https://reframax-primarias.netlify.app é a própria Netlify, ligada a este
# repositório. Com o secret NETLIFY_AUTH_TOKEN, este workflow também publica.
# As chaves do Firebase ficam em src/lib/firebase-config.js (não são senha).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-primarias
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar o Primárias
    runs-on: ubuntu-latest
    env:
      TEM_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && 'sim' || 'nao' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Publicar na Netlify
        if: ${{ env.TEM_TOKEN == 'sim' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 497192f5-083b-4633-b1d0-af935b286636
        run: npx --yes netlify-cli@17 deploy --dir=dist --functions=netlify/functions --prod --message "${GITHUB_SHA::7}"
