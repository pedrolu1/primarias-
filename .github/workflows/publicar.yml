name: Publicar

# Cada push na main monta o app e coloca no ar em https://reframax-primarias.netlify.app.
# A Netlify troca a versão de uma vez só, quando o envio termina.
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   FIREBASE_CONFIG     o bloco firebaseConfig copiado do console do Firebase
#   NETLIFY_AUTH_TOKEN  token pessoal da Netlify
#   VITE_APPCHECK_SITE_KEY (opcional) chave do reCAPTCHA v3 para o App Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-primarias
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar o Primárias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Conferir os secrets
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          falta=0
          if [ -z "$FIREBASE_CONFIG" ]; then echo "::error::Falta o secret FIREBASE_CONFIG (bloco firebaseConfig do console do Firebase)."; falta=1; fi
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then echo "::error::Falta o secret NETLIFY_AUTH_TOKEN (token pessoal da Netlify)."; falta=1; fi
          exit $falta

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}

      - name: Publicar na Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 497192f5-083b-4633-b1d0-af935b286636
        run: npx --yes netlify-cli@17 deploy --dir=dist --functions=netlify/functions --prod --message "${GITHUB_SHA::7}"
