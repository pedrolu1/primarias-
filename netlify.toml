# Netlify: site reframax-primarias (https://reframax-primarias.netlify.app),
# ligado ao repositório: cada push na main monta e publica. Os cabeçalhos (cache
# e quem pode abrir o app dentro de outra página) ficam em public/_headers.
[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "22" }

# Função /api/usuarios (senha provisória, exclusão, bloqueio e "esqueci a
# senha"). O firebase-admin vai inteiro, sem empacotar, porque carrega arquivos
# em tempo de execução.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]
